<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="icon" type="image/x-icon" href="https://santi-graphics.vercel.app/assets/SG.ico" />
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Rick">
  <title>Multimedia</title>

  <!-- Estilos externos -->
  <link href="Roger.css" rel="stylesheet" type="text/css">
  <link rel="author" href="https://santi-graphics.vercel.app/copyright.txt">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">

  <!-- Scripts externos -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="Roger.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <!-- BLOCK -->
  <script type="text/javascript">
  document.onkeydown = function(){return false};
  document.oncontextmenu = function(){return false}
  </script>

</head>
<body>

  <header class="main-header">
    <h1><i class="fa-solid fa-layer-group"></i> El Refugio De Los Pollos</h1>
  </header>

  <main class="dashboard-grid">
    
    <!-- 1. Reproductor -->
    <section class="card repro-card">
      <div class="card-header"><i class="fa-solid fa-radio"></i> <span>Reproductor</span></div>
      <div class="card-body">
        <iframe src="https://radio-tekileros.vercel.app/Repro26.html" title="Reproductor" allow="autoplay; encrypted-media" scrolling="no"></iframe>
      </div>
    </section>

    <!-- 2. Videojuego -->
    <section class="card game-card">
      <div class="card-header"><i class="fa-solid fa-gamepad"></i> <span>Zona de Juegos</span></div>
      <div class="card-body">
        <iframe src="https://iraked.github.io/Games/BubbleShooter.html" title="Bubble Shooter" allow="fullscreen" scrolling="no"></iframe>
      </div>
    </section>

    <!-- 3. Reglas -->
    <section class="card rules-card">
      <div class="card-header"><i class="fa-solid fa-scroll"></i> <span>Normas del Chat</span></div>
      <div class="card-body rules-body">
        <img src="https://i.postimg.cc/jdhC2gtM/Reglas-Destello-FX.png" alt="Reglas del Chat" class="reglas-img" />
      </div>
    </section>

    <!-- 4. Mapamundi -->
    <section class="card map-card">
      <div class="card-header">
        <i class="fa-solid fa-earth-americas"></i> <span>Visitantes Globales</span>
      </div>
      <div class="card-body map-body">
        <iframe src="https://iraked.github.io/Project/Mapamundi.html" title="Globo Terráqueo" scrolling="no"></iframe>
      </div>
    </section>
      
    <!-- 5. Social -->
    <div id="fb-root"></div>
    <script async defer crossorigin="anonymous" src="https://connect.facebook.net/es_LA/sdk.js#xfbml=1&version=v18.0"></script>

    <div class="fb-visual-container">
      <div class="fb-page"
         data-href="https://www.facebook.com/profile.php?id=100063525700488"
         data-tabs="timeline"
         data-width="380"
         data-height="500"
         data-small-header="false"
         data-adapt-container-width="true"
         data-hide-cover="false"
         data-show-facepile="false">
        <blockquote cite="https://www.facebook.com/profile.php?id=100063525700488" class="fb-xfbml-parse-ignore">
          <a href="https://www.facebook.com/profile.php?id=100063525700488">Facebook</a>
        </blockquote>
      </div>
    </div>

  </main>

  <div id="footer-lord">
    <footer class="main-footer">
      <a href="https://xat.com/LuzDeErendil" target="_blank" rel="noreferrer" class="footer-link">
        <img src="https://santi-graphics.vercel.app/assets/img/Santi-Graphics-Logo-SFX.png" alt="Santi Graphics" class="footer-icon">
        <h5 class="footer-copy">© 2026</h5>
      </a>
    </footer>
  </div>

</body>
</html>
