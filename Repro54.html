<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="icon" type="image/x-icon" href="https://santi-graphics.vercel.app/assets/SG.ico" />
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Rick">
  <title>En La Disco RG</title>
  
  <!-- Estilos externos -->
  <link rel="author" href="https://santi-graphics.vercel.app/copyright.txt">
  <link rel="stylesheet" href="Repro54.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <!-- Scripts externos -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.2.4/pixi.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.ripples/0.5.3/jquery.ripples.min.js"></script>
  <script src="Repro54.js" defer></script>
  
  <script type="text/javascript">
    document.onkeydown = function(){return false};
    document.oncontextmenu = function(){return false}
  </script>
</head>

<body>

<div class="main-container">
  <!-- Audio principal -->
  <audio id="player" autoplay muted></audio>

  <!-- Disco de Vinil -->
  <div class="ctn-disc">
    <img src="" alt="Disco de vinil" class="disc-img" />
  </div>

  <!-- Portada / Logo sobre el disco -->
  <div class="wrapper">
    <img src="" alt="Logo Central" class="cover-art" />
  </div>

  <!-- Imagen Fussion -->
  <div class="ctn-base">
    <img src="" alt="Imagen Base" class="stage-fussion" />
  </div>

  <!-- Metadatos -->
  <div class="metadata-marquee marquee">
    <span>En La Disco RG — Transmisión en Vivo</span>
  </div>

  <div class="info-marquee marquee">
    <span>Cargando fecha y hora...</span>
  </div>

  <!-- Controles -->
  <div class="controls-wrapper">
    <button id="playPause">
      <img src="" alt="Play/Pause" />
    </button>
    <button id="plus">
      <img src="" alt="Plus" />
    </button>
  </div>

  <button id="btn-rwd" class="btn-rwd">
    <i class="fas fa-backward-step"></i>
  </button>

  <button id="btn-fwd" class="btn-fwd">
    <i class="fas fa-forward-step"></i>
  </button>

  <!-- Decorativos -->
  <div class="decorative-wrapper">
    <div class="turbine-cover-container">
      <img src="" alt="Carátula en Turbina" class="turbine-cover-img" />
    </div>
    <img src="" alt="Botón decorativo" class="decorative-overlay" />
  </div>

  <!-- Mensaje -->
  <div id="custom-message" class="custom-message">Santi Graphics</div>
</div>

</body>
</html>
