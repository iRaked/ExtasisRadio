<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="icon" type="image/x-icon" href="https://santi-graphics.vercel.app/assets/SG.ico" />
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Rick">
  <title>Echo V4</title>

  <!-- Estilos externos-->
  <link href="Repro68.css" rel="stylesheet" type="text/css">
  <link rel="author" href="https://santi-graphics.vercel.app/copyright.txt">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/1.1.2/tailwind.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Scripts externos -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="Repro68.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.ripples/0.5.3/jquery.ripples.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.2.4/pixi.min.js"></script>
  <script type="text/javascript">
  document.onkeydown = function(){return false};
  document.oncontextmenu = function(){return false}
  </script>
  
</head>

<body>

  <section class="bg-water" id="stream1" data-tag="">

    <!-- ========================================== -->
    <!-- CAPA DE FONDO (PIXIJS VIDEO)               -->
    <!-- ========================================== -->
    <div id="contenedor-animado" class="capa-fondo" style="display: none;"></div>
    <!-- ========================================== -->

    <!-- Audio principal -->
    <audio id="player" autoplay muted></audio>

    <!-- Notas Musicales -->
    <aside class="music-notes-container">
        <span class="music-note">♪</span><span class="music-note">♫</span>
        <span class="music-note">♩</span><span class="music-note">♬</span>
        <span class="music-note">♪</span><span class="music-note">♫</span>
        <span class="music-note">♩</span><span class="music-note">♬</span>
    </aside>

    <!-- MAIN UI -->
    <div class="repro-box">
      
      <!-- HEADER (Depurado: Sin botón de cambio de modo) -->
      <div class="repro-header">
          <button class="btn-menu" id="btn-menu-tracks">
            <svg viewBox="0 0 512 512" class="icon-menu"><path d="M492 236H20c-11.046 0-20 8.954-20 20s8.954 20 20 20h472c11.046 0 20-8.954 20-20s-8.954-20-20-20zM492 76H20C8.954 76 0 84.954 0 96s8.954 20 20 20h472c11.046 0 20-8.954 20-20s-8.954-20-20-20zM492 396H20c-11.046 0-20 8.954-20 20s8.954 20 20 20h472c11.046 0 20-8.954 20-20s-8.954-20-20-20z"/></svg>
          </button>

          <div class="radioescuchas"><i class="fas fa-users"></i><span id="contadorRadio"></span></div>

          <div class="right-controls-wrapper">
            <!-- Botón de fondo (Mantenido por si la cliente lo requiere, si no, se puede eliminar este div completo) -->
            <button class="btn-plus" id="btn-bg-mode" title="Cambiar modo de fondo">
              <i class="fas fa-layer-group"></i>
            </button>
          </div>
      </div>

      <section id="visual-effects" class="visual-effects">
          <div class="logo-waves-wrapper">
              <figure class="radio-logo">
                  <img id="disc-img" src="https://santi-graphics.vercel.app/assets/covers/Cover1.png" alt="Carátula" />
              </figure>
              <div class="effects-layer">
                  <div class="orbital_container">
                      <div class="orbital_arc arc2"></div>
                      <div class="avatar-glow"></div>
                  </div>
              </div>
          </div>
      </section>
  
      <footer class="footer-2_5d">
        <div class="left-zone">
          <div class="meta-marquee"><div class="meta-track" id="meta-track">Cargando metadatos...</div></div>
        </div>
          
        <!-- LOGO -->
        <div class="bloque-bienvenida">
            <div class="logo-container">
                <img src="https://iraked.github.io/SantiGraphics/assets/bg/Clear2.png" alt="Logo" class="logo-base zoom-effect">
            </div>
            <div class="context-bienvenida">
                <p class="animtext"><span class="word">¡Bienvenidos!</span><span class="word">Freedom in your Soul</span></p>
            </div>
        </div>

        <div class="botonera">
          <div id="buttons" class="flex justify-center items-center mt-6">
            <!-- DEPURADO: Solo Play/Pause. Una radio no necesita prev/next/shuffle/repeat -->
            <button class="flex justify-center items-center w-20 h-20 rounded-full soft btn-play" id="btn-play-pause">
              <svg class="icon-play icons w-8 h-8" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 173.861 173.861"><defs><filter id="inset-shadow" x="-50%" y="-50%" width="200%" height="200%"><feComponentTransfer in="SourceAlpha"><feFuncA type="table" tableValues="1 0" /></feComponentTransfer><feGaussianBlur stdDeviation="12" /><feOffset dx="20" dy="20" result="offsetblur" /><feFlood flood-color="rgb(0, 0, 0)" result="color" /><feComposite in2="offsetblur" operator="in" /><feComposite in2="SourceAlpha" operator="in" /><feMerge><feMergeNode in="SourceGraphic" /><feMergeNode /></feMerge></filter></defs><g transform="translate(5,5)"><path d="M34.857 3.613C20.084-4.861 8.107 2.081 8.107 19.106v125.637c0 17.042 11.977 23.975 26.75 15.509L144.67 97.275c14.778-8.477 14.778-22.211 0-30.686L34.857 3.613z" filter="url(#inset-shadow)" fill="#17191e"/></g></svg>
              <svg class="icon-pause icons w-8 h-8 hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><rect x="30" y="20" width="20" height="80" fill="#17191e"/><rect x="70" y="20" width="20" height="80" fill="#17191e"/></svg>
            </button>
          </div>
        </div>

        <div class="right-zone">
          <i class="fas fa-volume-down volume-icon" id="volumeIcon"></i>
          <div class="volume-track"><input type="range" min="0" max="100" value="70" class="volume-bar" id="volumeBar" /></div>
          <i class="fas fa-volume-up volume-icon"></i>
        </div>
      </footer>

      <div id="custom-message" class="custom-message">Rick Graphics</div>
    </div> <!-- Cierre Main -->
  </section> <!-- Cierre BG-Water -->

  <!-- MODAL DE TRACKS (Adaptado exclusivamente para Historial de Radio) -->
  <div id="modal-tracks" class="modal hidden">
    <div class="modal-content">
      <button id="close-modal" class="modal-x">✕</button>
      <h2 class="modal-title">Historial de Radio</h2>
      <p class="modal-info">Últimas reproducciones: <span id="current-track-name">Cargando...</span></p>
      <ul class="track-list"></ul>
    </div>
  </div>

</body>
</html>
